name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      harness:
        description: Generate, build, and test every template
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-checks:
    name: Repo consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check repository structure
        run: python3 scripts/check_repo.py --strict
      - name: Compile helper scripts
        run: python3 -m compileall -q scripts .agents/skills/cargo-generate-template-builder

  discover:
    name: Discover templates
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: List templates
        id: list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            json=$(python3 scripts/validate_all.py --list-json --changed-since "$BASE_SHA")
          else
            json=$(python3 scripts/validate_all.py --list-json)
          fi
          echo "templates=$json" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.template }}
    needs: discover
    if: needs.discover.outputs.templates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate template
        run: python3 scripts/validate_all.py --strict --only "${{ matrix.template }}"

  harness:
    name: Harness ${{ matrix.template }}
    needs: discover
    if: >-
      needs.discover.outputs.templates != '[]' &&
      (github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.harness))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install cargo-generate (prebuilt)
        env:
          CARGO_GENERATE_VERSION: "0.26.0"
        run: |
          # Prebuilt musl binary from the project's GitHub releases. This is the
          # same artifact the upstream cargo-generate-action downloads, but at
          # the version the templates require, with no Docker build and no
          # source compile.
          base="https://github.com/cargo-generate/cargo-generate/releases/download"
          url="$base/v${CARGO_GENERATE_VERSION}/cargo-generate-v${CARGO_GENERATE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" | tar xz -C "$HOME/.cargo/bin" cargo-generate
          cargo generate --version
      - name: Generate, build, and test template
        run: python3 scripts/harness.py --template "${{ matrix.template }}" --timeout 900
